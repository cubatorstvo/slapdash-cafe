name: Temporary masterclass time regression

on:
  push:
    branches:
      - fix/masterclass-time-availability
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Stage 8 onboarding
        run: timeout 90s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/test_stage8_onboarding.gd
      - name: Masterclass independence
        run: timeout 90s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/test_masterclass_independence.gd
