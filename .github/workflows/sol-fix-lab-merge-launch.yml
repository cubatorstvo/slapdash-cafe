name: Sol diagnose launch after laboratory merge
on:
  push:
    branches:
      - sol/fix-lab-merge-launch
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/fix-lab-merge-launch
          fetch-depth: 0
      - name: Download Godot 4.7
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
      - name: Parse and import
        run: |
          set -o pipefail
          timeout 90s /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 | tee /tmp/godot-parse.log
          if grep -q "SCRIPT ERROR:\|Parse Error:\|Compile Error:" /tmp/godot-parse.log; then exit 1; fi
      - name: Launch main scene briefly
        run: |
          set -o pipefail
          timeout 12s /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . 2>&1 | tee /tmp/godot-launch.log || code=$?
          code=${code:-0}
          if grep -q "SCRIPT ERROR:\|Parse Error:\|Compile Error:\|Invalid call\|Invalid access\|ERROR:" /tmp/godot-launch.log; then exit 1; fi
          if [ "$code" != "0" ] && [ "$code" != "124" ]; then exit "$code"; fi
