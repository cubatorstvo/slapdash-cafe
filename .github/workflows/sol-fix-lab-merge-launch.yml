name: Sol diagnose launch after laboratory merge
on:
  push:
    branches:
      - sol/fix-lab-merge-launch
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/fix-lab-merge-launch
          fetch-depth: 0
      - name: Apply launch fix candidate
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path)
              s=p.read_text()
              if old not in s:
                  raise SystemExit(f'target not found in {path}: {old!r}')
              p.write_text(s.replace(old,new,1))

          replace('scripts/clone_laboratory.gd', '\tvar before:=p.lab_formula_tempo\n', '\tvar before: float=float(p.lab_formula_tempo)\n')
          p=Path('scripts/clone_nursery.gd')
          s=p.read_text()
          s=s.replace('\t\t\tvar error:=seed(value)\n','\t\t\tvar error: String=seed_pot(value)\n')
          s=s.replace('func seed(value: Dictionary, reserve := 0) -> String:\n','func seed_pot(value: Dictionary, reserve := 0) -> String:\n')
          s=s.replace('\tvar error:=seed(value,reserve)\n','\tvar error: String=seed_pot(value,reserve)\n')
          p.write_text(s)
          replace('scripts/laboratory_instrument_ui.gd', '\t\tvar age:=shown_age/calibration.scale_time() if state.phase=="manual" else 0.0\n', '\t\tvar age: float=float(shown_age)/float(calibration.scale_time()) if state.phase=="manual" else 0.0\n')
          replace('scripts/nursery_view.gd', '\t\t\tvar growth:=1.0-float(value.remaining)/nursery.STAGE_SECONDS\n', '\t\t\tvar growth: float=1.0-float(value.remaining)/float(nursery.STAGE_SECONDS)\n')
          replace('scripts/nursery_view.gd', '\t\t\tvar start:=game.laboratory.peer_position(peer)+Vector3(-0.3 if i==0 else 0.3,1.2,0)\n', '\t\t\tvar start: Vector3=game.laboratory.peer_position(peer)+Vector3(-0.3 if i==0 else 0.3,1.2,0)\n')
          PY
      - name: Download Godot 4.7
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
      - name: Parse and import
        run: |
          set -o pipefail
          timeout 90s /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 | tee /tmp/godot-parse.log
          if grep -q "SCRIPT ERROR:\|Parse Error:\|Compile Error:" /tmp/godot-parse.log; then exit 1; fi
      - name: Launch main scene briefly
        run: |
          set -o pipefail
          timeout 12s /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . 2>&1 | tee /tmp/godot-launch.log || code=$?
          code=${code:-0}
          if grep -q "SCRIPT ERROR:\|Parse Error:\|Compile Error:\|Invalid call\|Invalid access" /tmp/godot-launch.log; then exit 1; fi
          if [ "$code" != "0" ] && [ "$code" != "124" ]; then exit "$code"; fi
      - name: Focused tests
        run: |
          set -e
          timeout 90s /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/test_clone_laboratory.gd -- --fresh-cafe
          timeout 90s /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/test_cafe_annex.gd -- --fresh-cafe
          timeout 90s /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/test_cafe_life.gd -- --fresh-cafe
          timeout 90s /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/test_chef_orders.gd -- --fresh-cafe
          timeout 90s /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/test_input.gd -- --fresh-cafe
      - name: Publish clean fix branch
        run: |
          git diff origin/main -- scripts/clone_laboratory.gd scripts/clone_nursery.gd scripts/laboratory_instrument_ui.gd scripts/nursery_view.gd > /tmp/launch-fix.patch
          test -s /tmp/launch-fix.patch
          git reset --hard origin/main
          git apply /tmp/launch-fix.patch
          git config user.name ChatGPT
          git config user.email noreply@openai.com
          git add scripts/clone_laboratory.gd scripts/clone_nursery.gd scripts/laboratory_instrument_ui.gd scripts/nursery_view.gd
          git commit -m "Fix Godot 4.7 launch after laboratory merge"
          git branch -f sol/fix-lab-merge-launch-final HEAD
          git push -f origin sol/fix-lab-merge-launch-final
