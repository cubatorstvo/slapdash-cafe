name: Counter Station Art Preview

on:
  push:
    branches:
      - work/counter-station-art
    paths:
      - scenes/stations/counter_station.tscn
      - scripts/counter_station_art.gd
      - tests/test_countertop_faces.gd
      - tests/capture_counter_station_art.gd
      - .github/workflows/counter_station_art.yml

permissions:
  contents: write

jobs:
  verify-and-capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip xvfb libgl1

      - name: Install Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          ./Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import and parse
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Countertop regression
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/test_countertop_faces.gd

      - name: Existing layout regression
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/test_counter_layout.gd

      - name: Capture previews
        run: xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --path . --rendering-method gl_compatibility -s res://tests/capture_counter_station_art.gd

      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: counter-station-preview
          path: artifacts/counter_station/*.png

      - name: Publish preview images on work branch
        run: |
          git config user.name "chatgpt-preview"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/counter_station/*.png
          git commit -m "Preview counter station art [skip ci]" || exit 0
          git push
