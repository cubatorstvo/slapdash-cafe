name: Temporary surface screenshots
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Install Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Capture validation screenshots
        run: |
          mkdir -p docs/validation
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --quit
          xvfb-run -a /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --script tests/capture_surface_contact_alignment.gd
          mv /tmp/surface_potato.png docs/validation/surface_potato.png
          mv /tmp/surface_sausage.png docs/validation/surface_sausage.png
          mv /tmp/surface_sofa.png docs/validation/surface_sofa.png
      - name: Commit screenshots and clean temporary capture files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/surface_potato.png docs/validation/surface_sausage.png docs/validation/surface_sofa.png
          git rm tests/capture_surface_contact_alignment.gd .github/workflows/tmp-surface-screenshots.yml
          git commit -m "Add surface alignment validation screenshots"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
