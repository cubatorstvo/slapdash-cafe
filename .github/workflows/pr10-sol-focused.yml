name: Focused Godot 4.7 validation for PR 10

on:
  push:
    branches:
      - work/pr10-sol-focused

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/pr10-sol-focused
          fetch-depth: 0
      - name: Download Godot 4.7
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
      - name: Import and compile
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.7-stable_linux.x86_64
          timeout 120s $G --headless --path . --editor --quit 2>&1 | tee /tmp/import.log
          ! grep -q "SCRIPT ERROR:\|Parse Error:\|Compile Error:" /tmp/import.log
      - name: Focused regression suite
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.7-stable_linux.x86_64
          for test in \
            tests/test_cafe_journey.gd \
            tests/test_cafe_life.gd \
            tests/test_first_star.gd \
            tests/test_chef_orders.gd \
            tests/test_clone_laboratory.gd \
            tests/test_shop_feeding.gd \
            tests/test_cafe_annex.gd \
            tests/test_placement_lounge_flow.gd \
            tests/test_stations.gd \
            tests/test_crew_bundles.gd \
            tests/test_worker_identity.gd \
            tests/test_input.gd; do
            echo "===== $test ====="
            timeout 120s $G --headless --path . --script "$test" -- --fresh-cafe
          done
      - name: Smoke-run main scene
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.7-stable_linux.x86_64
          set +e
          timeout 15s $G --headless --path . > /tmp/smoke.log 2>&1
          code=$?
          set -e
          cat /tmp/smoke.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi
          ! grep -q "SCRIPT ERROR:\|Parse Error:\|Compile Error:\|Invalid call\|Invalid get index\|Attempt to call" /tmp/smoke.log
