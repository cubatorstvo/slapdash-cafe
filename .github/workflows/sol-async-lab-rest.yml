name: Sol async laboratory and rest cycle
on:
  push:
    branches:
      - sol/async-lab-rest
    paths:
      - .github/workflows/sol-async-lab-rest.yml
permissions:
  contents: write
jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/async-lab-rest
          fetch-depth: 0
      - name: Implement asynchronous lab and nightly rest
        run: python .github/sol_async_patch.py
      - name: Download Godot 4.7
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Focused tests
        run: |
          set -e
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/test_clone_laboratory.gd
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/test_cafe_life.gd
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/test_clone_tempo.gd
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/test_input.gd
      - name: Commit tested implementation
        run: |
          git config user.name ChatGPT
          git config user.email noreply@openai.com
          git add scripts/clone_laboratory.gd scripts/staff_evening.gd scripts/work_station.gd scripts/cafe_service.gd scripts/cafe_progression.gd scripts/coop_session.gd scripts/steam_lobby.gd tests/test_clone_laboratory.gd tests/test_cafe_life.gd docs/LABORATORY_AND_RECIPE_BOOK.md
          git commit -m "Run clone growth alongside cafe work and add nightly rest"
          git push origin HEAD:sol/async-lab-rest
