name: Sol cafe layout check

on:
  push:
    branches:
      - sol/cafe-product-layout
  workflow_dispatch:

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import urllib.request
          url = "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          urllib.request.urlretrieve(url, "/tmp/godot.zip")
          PY
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version || true

      - name: Targeted layout regressions
        shell: bash
        run: |
          set -euxo pipefail
          "$GODOT_BIN" --headless --path . --script res://tests/test_product_layout_geometry.gd
          "$GODOT_BIN" --headless --path . --script res://tests/test_cafe_expansion_layout.gd
          "$GODOT_BIN" --headless --path . --script res://tests/test_cafe_annex.gd
          "$GODOT_BIN" --headless --path . --script res://tests/test_delivery_installers.gd

      - name: Capture cafe layout
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          xvfb-run -a "$GODOT_BIN" --path . --rendering-method gl_compatibility --script res://tests/capture_product_layout.gd

      - name: Collect captures
        if: always()
        shell: bash
        run: |
          mkdir -p layout-captures
          cp /tmp/sol-layout-*.png layout-captures/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sol-cafe-layout-captures
          path: layout-captures
          if-no-files-found: warn
