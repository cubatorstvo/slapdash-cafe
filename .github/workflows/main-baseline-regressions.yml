name: Check baseline failing regressions

on:
  push:
    branches:
      - work/main-baseline-regressions

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_first_star.gd
          - test_stations.gd
          - test_shop_feeding.gd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/main-baseline-regressions
      - name: Download Godot 4.7
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
      - name: Import
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.7-stable_linux.x86_64
          timeout 90s $G --headless --path . --editor --quit >/tmp/import.log 2>&1
          ! grep -q "SCRIPT ERROR:\|Parse Error:\|Compile Error:" /tmp/import.log
      - name: Run test
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.7-stable_linux.x86_64
          timeout 90s $G --headless --path . --script tests/${{ matrix.test }} -- --fresh-cafe
