name: Verify third-star scaling

on:
  push:
    branches:
      - work/third-star-verify

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/third-star-verify

      - name: Download Godot 4.7
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64

      - name: Import project
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.7-stable_linux.x86_64
          timeout 90s $G --headless --path . --editor --quit 2>&1 | tee /tmp/import.log
          ! grep -q "SCRIPT ERROR:\|Parse Error:\|Compile Error:" /tmp/import.log

      - name: Focused regression tests
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.7-stable_linux.x86_64
          for T in             tests/test_third_star.gd             tests/test_cafe_journey.gd             tests/test_cafe_life.gd             tests/test_chef_orders.gd             tests/test_clone_laboratory.gd             tests/test_cafe_annex.gd             tests/test_placement_lounge_flow.gd             tests/test_crew_bundles.gd             tests/test_worker_identity.gd             tests/test_input.gd
          do
            echo "=== $T ==="
            timeout 90s $G --headless --path . --script "$T" -- --fresh-cafe
          done

      - name: Smoke-run main scene
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.7-stable_linux.x86_64
          set +e
          timeout 15s $G --headless --path . 2>&1 | tee /tmp/smoke.log
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 124 ]; then exit "$CODE"; fi
          ! grep -q "SCRIPT ERROR:\|Parse Error:\|Compile Error:\|Invalid call\|Invalid get index\|Invalid assignment" /tmp/smoke.log
