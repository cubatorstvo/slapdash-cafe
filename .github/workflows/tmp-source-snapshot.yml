name: Temporary source snapshot

on:
  push:
    branches:
      - sol/cafe-product-layout
    paths:
      - ".github/workflows/tmp-source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build lightweight source archive
        run: |
          mkdir -p /tmp/source
          rsync -a ./ /tmp/source/             --exclude ".git/"             --exclude ".godot/"             --exclude "*.dll"             --exclude "*.so"             --exclude "*.dylib"             --exclude "*.pdb"
          cd /tmp
          zip -qr slapdash-cafe-source.zip source
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: slapdash-cafe-source
          path: /tmp/slapdash-cafe-source.zip
          if-no-files-found: error
          retention-days: 1
