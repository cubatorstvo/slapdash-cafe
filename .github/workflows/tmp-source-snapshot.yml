name: Temporary source snapshot

on:
  push:
    branches:
      - feature/prototype-cafe-layout
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/prototype-cafe-layout
          fetch-depth: 0
      - name: Apply saved layout migration patch once
        shell: bash
        run: |
          set -e
          base64 -d .tmp/layout.patch.gz.b64 | gzip -d > /tmp/layout.patch
          if patch --dry-run -p1 < /tmp/layout.patch >/dev/null 2>&1; then
            patch -p1 < /tmp/layout.patch
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts
            git commit -m "WIP migrate cafe to prototype layout"
            git push origin HEAD:feature/prototype-cafe-layout
          else
            echo "Layout patch already applied or no longer applies; leaving branch unchanged."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
