name: Temporary scene-migration bootstrap

on:
  push:
    branches:
      - work/scene-migration
    paths:
      - ".github/workflows/tmp-source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build lightweight source archive
        run: |
          mkdir -p /tmp/source
          rsync -a ./ /tmp/source/ \
            --exclude ".git/" \
            --exclude ".godot/" \
            --exclude "*.dll" \
            --exclude "*.so" \
            --exclude "*.dylib" \
            --exclude "*.pdb"
          cd /tmp
          zip -qr slapdash-cafe-source.zip source
      - name: Download Godot 4.7.2
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: scene-migration-source
          path: /tmp/slapdash-cafe-source.zip
          if-no-files-found: error
          retention-days: 1
      - name: Upload Godot
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7.2-linux
          path: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          if-no-files-found: error
          retention-days: 1
