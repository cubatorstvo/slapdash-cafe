name: Temporary source snapshot
on:
  push:
    branches:
      - sol/counter-station-scene-authored-final
  pull_request:
    branches:
      - main
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: slapdash-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
