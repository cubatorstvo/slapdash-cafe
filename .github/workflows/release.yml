name: Release placement and lounge flow
on:
  push:
    branches: [work/placement-lounge-release]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/placement-lounge-release
          fetch-depth: 0
      - name: Materialize candidate
        run: |
          set -euo pipefail
          git fetch origin work/placement-beacon-lounge-flow:refs/remotes/origin/work/placement-beacon-lounge-flow
          git show origin/work/placement-beacon-lounge-flow:.github/workflows/placement-beacon-lounge-flow.yml > /tmp/source.yml
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/source.yml').read_text().splitlines(); marker='      - name: Apply implementation'; start=lines.index(marker)+1
          while lines[start] != '        run: |': start+=1
          start+=1; end=start
          while end<len(lines) and not lines[end].startswith('      - name: '): end+=1
          Path('/tmp/apply.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])+'\n')
          PY
          git checkout --detach origin/main
          bash /tmp/apply.sh
          cat > tests/test_placement_lounge_flow.gd <<'GD'
          extends SceneTree
          var failures:=0
          func _initialize() -> void: run.call_deferred()
          func check(ok: bool, message: String) -> void:
              if not ok: failures+=1; printerr("FAIL: ",message)
          func run() -> void:
              var game=preload("res://scenes/cafe.tscn").instantiate(); root.add_child(game); await process_frame
              game.set_physics_process(false)
              game.service.clear_world(); game.service.initial_stations(true)
              var p=game.service.progress
              p.stars=1; p.lab_stage=3; p.lounge_tier=1; p.lounge_items=["sofa"]; p.lounge_upgrades=[]; p.shift="night"; p.night_elapsed=90.0
              for _i in range(4): game.service.create_clone(1.0,true)
              game.evening._process(0.016)
              var before_positions: Dictionary={}
              for id in game.evening.performers:
                  var entry: Dictionary=game.evening.performers[id]
                  before_positions[int(id)]=entry.actor.global_position
              check(before_positions.size()>=2,"Several resting clones exist before a new item arrives")

              var delivery_id: int=p.next_delivery_id; p.next_delivery_id+=1
              p.deliveries.append({"id":delivery_id,"item":"rest_arcade","station":0,"remaining":0.0,"owner":1,"position":[0.0,0.3,0.0]})
              var parcel: Dictionary=game.shop.parcel_by_id(delivery_id)
              var target: Vector3=game.shop.installation_position(parcel)
              game.player.global_position=target
              game.shop._process(0.20)
              check(game.shop.local_ghost.visible,"Held box shows an exact glowing placement footprint")
              check(game.shop.placement_beacon.visible,"Held box shows a tall world-space beacon")
              check(game.shop.placement_label.visible and game.shop.placement_label.text.contains("УСТАНОВИТЬ СЮДА"),"Beacon has an explicit install label")
              check(game.shop.local_ghost.global_position.distance_to(target)<0.01,"Placement footprint marks the actual install point")
              check(game.shop.placement_label.text.contains("Аркадный автомат"),"Beacon names the carried destination item")

              var player_before: Vector3=game.player.global_position
              var error: String=game.shop.action(1,{"action":"install_parcel","id":delivery_id})
              check(error.is_empty() and "arcade" in p.lounge_items,"Arcade installs from its delivery box")
              game.annex.refresh_shell()
              check(game.player.global_position.distance_to(player_before)<0.001,"Installing furniture never relocates the player")

              game.evening._process(0.016)
              var arcade_id: int=0
              for id in game.evening.performers:
                  var entry: Dictionary=game.evening.performers[id]
                  if str(entry.get("spot_id",""))=="arcade_player": arcade_id=int(id); break
              check(arcade_id>0,"One resting clone chooses the newly installed arcade")
              if arcade_id>0:
                  var entry: Dictionary=game.evening.performers[arcade_id]
                  check(bool(entry.get("reroute_active",false)),"Clone starts a fresh route instead of teleporting")
                  check(before_positions.has(arcade_id) and entry.actor.global_position.distance_to(before_positions[arcade_id])<0.05,"Fresh route starts at clone's current position")
                  check(entry.actor.caption.text.contains("бежит смотреть новинку"),"Clone visibly reacts to the new item")
                  p.night_elapsed+=0.20; game.evening._process(0.016)
                  entry=game.evening.performers[arcade_id]
                  var moved: float=entry.actor.global_position.distance_to(before_positions[arcade_id])
                  check(moved>0.02 and moved<2.0,"Clone runs smoothly rather than snapping")
                  for _i in range(140):
                      p.night_elapsed+=0.10; game.evening._process(0.016)
                  entry=game.evening.performers[arcade_id]
                  check(str(entry.get("spot_id",""))=="arcade_player" and not bool(entry.get("reroute_active",false)),"Clone finishes at the newly chosen activity")
                  check(entry.actor.global_position.distance_to(Vector3(16.6,0,12.85))<0.35,"Clone physically reaches the arcade")
              game._shutdown_tree(game); game.free()
              print("PASS: obvious box destination, stable player and smooth clone reaction" if failures==0 else "FAILURES: %d"%failures)
              quit(0 if failures==0 else 1)
          GD
      - name: Download Godot 4.7
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
      - name: Verify Godot and regressions
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.7-stable_linux.x86_64
          timeout 90s $G --headless --path . --editor --quit 2>&1 | tee /tmp/parse.log
          ! grep -q "SCRIPT ERROR:\|Parse Error:\|Compile Error:" /tmp/parse.log
          timeout 90s $G --headless --path . --script tests/test_placement_lounge_flow.gd -- --fresh-cafe
          timeout 90s $G --headless --path . --script tests/test_shop_feeding.gd -- --fresh-cafe
          timeout 90s $G --headless --path . --script tests/test_cafe_annex.gd -- --fresh-cafe
          timeout 90s $G --headless --path . --script tests/test_cafe_life.gd -- --fresh-cafe
      - name: Publish clean implementation
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git checkout -B sol/placement-beacon-lounge-flow-final origin/main
          git add scripts/cafe_shop.gd scripts/cafe_annex.gd scripts/lounge_layout.gd scripts/staff_evening.gd tests/test_placement_lounge_flow.gd
          git commit -m "Clarify delivery placement and smooth lounge reactions"
          git push --force origin HEAD:sol/placement-beacon-lounge-flow-final
