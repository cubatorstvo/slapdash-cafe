name: Masterclasses stage 4 smoke

on:
  push:
    branches:
      - work/masterclasses-stage4

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_scale_delivery.gd
          - test_shop_feeding.gd
          - test_table_groups.gd
          - test_stations.gd
          - test_cafe_annex.gd
          - test_worker_identity.gd
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Run test
        timeout-minutes: 3
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/${{ matrix.test }}
