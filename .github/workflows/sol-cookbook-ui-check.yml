name: Sol cookbook UI check

on:
  push:
    branches:
      - fix/cookbook-ui-mode
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cookbook:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_BIN: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb unzip libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2t64
      - name: Download official Godot 4.7.2
        run: |
          mkdir -p /tmp/godot /tmp/cookbook-captures
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
      - name: Import and parse project
        run: "$GODOT_BIN" --headless --path . --import
      - name: Feature-access regression
        run: timeout 90s "$GODOT_BIN" --headless --path . --script res://tests/test_feature_access.gd
      - name: Cookbook regressions
        shell: bash
        run: |
          set -o pipefail
          timeout 180s "$GODOT_BIN" --headless --path . --script res://tests/test_cookbook.gd 2>&1 | tee /tmp/cookbook-existing.log
          timeout 90s "$GODOT_BIN" --headless --path . --script res://tests/test_cookbook_visibility.gd 2>&1 | tee /tmp/cookbook-visibility.log
      - name: Runtime smoke
        shell: bash
        run: |
          set +e
          timeout 8s "$GODOT_BIN" --headless --path . > /tmp/runtime-smoke.log 2>&1
          code=$?
          set -e
          cat /tmp/runtime-smoke.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access" /tmp/runtime-smoke.log; then exit 1; fi
      - name: Capture cookbook at acceptance resolutions
        timeout-minutes: 5
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 "$GODOT_BIN" --path . --rendering-method gl_compatibility --script res://tests/capture_cookbook_visibility.gd
      - name: Collect captures and logs
        if: always()
        run: |
          cp /tmp/cookbook-*.png /tmp/cookbook-captures/ 2>/dev/null || true
          cp /tmp/cookbook-*.log /tmp/cookbook-captures/ 2>/dev/null || true
          cp /tmp/runtime-smoke.log /tmp/cookbook-captures/ 2>/dev/null || true
          ls -lh /tmp/cookbook-captures || true
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cookbook-ui-captures
          path: /tmp/cookbook-captures
          if-no-files-found: warn
          retention-days: 3
