name: Push Solyanka To Main
on:
  push:
    branches:
      - chatgpt-sync-snapshot
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild patch payload
        run: |
          cat .solyanka-push/chunk-00.txt .solyanka-push/chunk-01.txt .solyanka-push/chunk-02.txt .solyanka-push/chunk-03.txt | base64 -d | xz -d > /tmp/solyanka.patch
      - name: Apply to current main and push
        run: |
          git fetch origin main
          git checkout -B deploy origin/main
          git apply /tmp/solyanka.patch
          git add -A
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add three-role solyanka kitchen"
          git push origin HEAD:main
