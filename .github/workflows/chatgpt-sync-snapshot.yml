name: ChatGPT Main Patch
on:
  push:
    branches:
      - chatgpt-sync-snapshot

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified patch to main
        run: |
          shopt -s nullglob
          parts=(.sync/patch-part-*)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "No main patch chunks in this revision."
            exit 0
          fi
          cat "${parts[@]}" > /tmp/apply-main.patch.gz.b64
          base64 -d /tmp/apply-main.patch.gz.b64 | gzip -d > /tmp/apply-main.patch
          git fetch origin main
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "15129dd9bc8a40729ecd6e11e6405b990a61d50b"
          patch -p1 < /tmp/apply-main.patch
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add three-role solyanka kitchen"
          git push origin HEAD:main
