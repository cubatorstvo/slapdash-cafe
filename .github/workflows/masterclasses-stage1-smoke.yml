name: Masterclasses stage 1 smoke

on:
  push:
    branches:
      - work/masterclasses-stage1

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_masterclasses.gd
          - test_stations.gd
          - test_counter_layout.gd
          - test_fifth_star_prep.gd
          - test_cafe_life.gd
          - test_cafe_journey.gd
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Run test
        timeout-minutes: 2
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/${{ matrix.test }}
