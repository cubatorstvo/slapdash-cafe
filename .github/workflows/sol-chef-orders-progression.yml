name: Sol chef order progression
on:
  push:
    branches:
      - sol/chef-orders-progression
permissions:
  contents: write
jobs:
  implement-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/chef-orders-progression
          fetch-depth: 0
      - name: Apply implementation patch
        run: |
          python .github/patch_chef_orders_progression.py
          git diff -- scripts/cafe_progression.gd scripts/cafe_service.gd tests/test_cafe_life.gd tests/test_chef_orders.gd > /tmp/chef-orders.patch
          test -s /tmp/chef-orders.patch
      - name: Download Godot 4.7
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
      - name: Parse and import
        run: |
          set -o pipefail
          timeout 90s /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 | tee /tmp/godot-parse.log
          if grep -q "SCRIPT ERROR:\|Parse Error:\|Compile Error:" /tmp/godot-parse.log; then exit 1; fi
      - name: Focused tests
        run: |
          set -e
          timeout 90s /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/test_chef_orders.gd -- --fresh-cafe
          timeout 90s /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/test_cafe_life.gd -- --fresh-cafe
          timeout 90s /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/test_worker_identity.gd -- --fresh-cafe
          timeout 90s /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/test_input.gd -- --fresh-cafe
      - name: Publish final branch
        run: |
          git config user.name ChatGPT
          git config user.email noreply@openai.com
          git add scripts/cafe_progression.gd scripts/cafe_service.gd tests/test_cafe_life.gd tests/test_chef_orders.gd
          git commit -m "Scale personal chef orders with cafe stars"
          git branch -f sol/chef-orders-progression-final HEAD
          git push -f origin sol/chef-orders-progression-final
