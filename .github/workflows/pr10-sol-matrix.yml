name: Parallel Godot 4.7 tests for PR 10

on:
  push:
    branches:
      - work/pr10-sol-matrix

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_cafe_journey.gd
          - test_cafe_life.gd
          - test_first_star.gd
          - test_chef_orders.gd
          - test_clone_laboratory.gd
          - test_shop_feeding.gd
          - test_cafe_annex.gd
          - test_placement_lounge_flow.gd
          - test_stations.gd
          - test_crew_bundles.gd
          - test_worker_identity.gd
          - test_input.gd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/pr10-sol-matrix
      - name: Download Godot 4.7
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
      - name: Import
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.7-stable_linux.x86_64
          timeout 90s $G --headless --path . --editor --quit 2>&1 | tee /tmp/import.log
          ! grep -q "SCRIPT ERROR:\|Parse Error:\|Compile Error:" /tmp/import.log
      - name: Run test
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.7-stable_linux.x86_64
          timeout 90s $G --headless --path . --script tests/${{ matrix.test }} -- --fresh-cafe
