name: Training fixes stage 3 full regression
on:
  push:
    branches:
      - work/training-fixes-stage3
concurrency:
  group: training-fixes-stage3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import project
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Run all single-process regressions
        run: python3 tests/run_headless_suite.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Run online host guest observer regression
        run: python3 tests/run_online_cafe_test.py /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
