name: Training fixes stage 3 targeted
on:
  push:
    branches:
      - work/training-fixes-stage3
concurrency:
  group: training-fixes-stage3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_course_editor_ui.gd
          - test_training_queue_core.gd
          - test_training_queue_night.gd
          - test_training_queue_versions_save.gd
          - test_table_groups.gd
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import project
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Run test
        run: timeout 180s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/${{ matrix.test }}
