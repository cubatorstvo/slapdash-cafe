name: Sol external laboratory and rest rooms
on:
  push:
    branches:
      - sol/external-lab-rest-rooms
    paths:
      - .github/workflows/sol-external-rooms.yml
permissions:
  contents: write
jobs:
  implement-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/external-lab-rest-rooms
          fetch-depth: 0
      - name: Apply implementation
        run: |
          python .github/patch_external_rooms_core.py
          python .github/patch_external_rooms_views.py
          python .github/patch_external_rooms_tests.py
          git add -N tests/test_cafe_annex.gd
          git diff origin/main -- scripts/cafe_annex.gd scripts/cafe.gd scripts/clone_laboratory.gd scripts/cafe_shop.gd scripts/cafe_development_view.gd scripts/staff_evening.gd tests/test_clone_laboratory.gd tests/test_cafe_life.gd tests/test_cafe_annex.gd docs/LABORATORY_AND_RECIPE_BOOK.md > /tmp/external_rooms.patch
          test -s /tmp/external_rooms.patch
      - name: Download Godot 4.7
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
      - name: Parse and import
        run: timeout 90s /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Focused tests
        run: |
          set -e
          timeout 90s /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/test_cafe_annex.gd -- --fresh-cafe
          timeout 90s /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/test_clone_laboratory.gd -- --fresh-cafe
          timeout 90s /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/test_cafe_life.gd -- --fresh-cafe
          timeout 90s /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/test_clone_tempo.gd -- --fresh-cafe
          timeout 90s /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/test_input.gd -- --fresh-cafe
      - name: Publish clean tested branch
        run: |
          git reset --hard origin/main
          git clean -fd
          git switch -C sol/external-lab-rest-final origin/main
          git apply /tmp/external_rooms.patch
          git config user.name ChatGPT
          git config user.email noreply@openai.com
          git add scripts/cafe_annex.gd scripts/cafe.gd scripts/clone_laboratory.gd scripts/cafe_shop.gd scripts/cafe_development_view.gd scripts/staff_evening.gd tests/test_clone_laboratory.gd tests/test_cafe_life.gd tests/test_cafe_annex.gd docs/LABORATORY_AND_RECIPE_BOOK.md
          git commit -m "Move laboratory and rest room into external annex"
          git push --force-with-lease origin HEAD:sol/external-lab-rest-final
# tests run with isolated fresh cafe state
