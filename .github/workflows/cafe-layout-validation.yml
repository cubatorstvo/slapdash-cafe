name: Cafe layout validation

on:
  push:
    branches:
      - feature/prototype-cafe-layout
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.7.2
      GODOT_BIN: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb unzip libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2t64

      - name: Download Godot 4.7.2
        run: |
          mkdir -p /tmp/godot
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version

      - name: Import project assets
        run: |
          "$GODOT_BIN" --headless --path . --import

      - name: Run layout regression
        run: |
          "$GODOT_BIN" --headless --path . --script res://tests/test_cafe_expansion_layout.gd

      - name: Run affected integration regressions
        run: |
          for test in test_cafe_annex.gd test_delivery_installers.gd test_staff_lounge.gd test_first_star.gd test_third_star.gd; do
            echo "::group::$test"
            "$GODOT_BIN" --headless --path . --script "res://tests/$test"
            echo "::endgroup::"
          done

      - name: Capture all four layout stages
        run: |
          mkdir -p /tmp/cafe_layout_capture
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 "$GODOT_BIN" --path . --rendering-method gl_compatibility --script res://tests/capture_cafe_expansion_layout.gd -- /tmp/cafe_layout_capture

      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cafe-layout-screenshots
          path: /tmp/cafe_layout_capture
          if-no-files-found: warn
          retention-days: 3
