name: Cafe layout capture

on:
  push:
    branches:
      - feature/prototype-cafe-layout
    paths:
      - ".github/workflows/cafe-layout-capture.yml"
      - "tests/capture_cafe_expansion_layout.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GODOT_BIN: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb unzip libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2t64
      - name: Download Godot
        run: |
          mkdir -p /tmp/godot /tmp/cafe_layout_capture
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "$GODOT_BIN"
      - name: Import project
        run: |
          "$GODOT_BIN" --headless --path . --import
      - name: Capture stages
        timeout-minutes: 4
        run: |
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 "$GODOT_BIN" --path . --rendering-method gl_compatibility --script res://tests/capture_cafe_expansion_layout.gd -- /tmp/cafe_layout_capture
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cafe-layout-screenshots
          path: /tmp/cafe_layout_capture
          if-no-files-found: error
          retention-days: 3
