name: Temporary masterclass regression

on:
  push:
    branches:
      - feature/independent-masterclass-training
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import project
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Independent masterclass regression
        run: timeout 90s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/test_masterclass_independence.gd
      - name: Training queue regression
        if: always()
        run: timeout 90s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/test_training_queue_core.gd
      - name: Stage 8 onboarding
        if: always()
        run: timeout 90s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/test_stage8_onboarding.gd
      - name: Stage 8 integration
        if: always()
        run: timeout 90s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/test_stage8_integration.gd
      - name: Stage 8 scale
        if: always()
        run: timeout 90s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/test_stage8_scale.gd
      - name: Cafe insights
        if: always()
        run: timeout 90s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/test_cafe_insights.gd
      - name: Cafe journey
        if: always()
        run: timeout 90s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/test_cafe_journey.gd
