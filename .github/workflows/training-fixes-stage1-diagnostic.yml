name: Training fixes stage 1 diagnostic
on:
  push:
    branches:
      - work/training-fixes-stage1
jobs:
  parse-service:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Parse service directly
        shell: bash
        run: |
          set -o pipefail
          timeout 15s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/cafe_service.gd
