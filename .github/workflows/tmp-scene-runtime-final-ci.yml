name: Scene runtime final CI

on:
  push:
    branches:
      - work/scene-runtime-final-ci
    paths:
      - ".github/workflows/tmp-scene-runtime-final-ci.yml"

permissions:
  contents: read

jobs:
  scene-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_BIN: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      GODOT_SILENCE_ROOT_WARNING: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2t64

      - name: Download official Godot 4.7.2 stable
        run: |
          mkdir -p /tmp/godot
          curl -L --fail --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version

      - name: Import and parse project
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --editor --path . --import --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/import.log; then
            exit 1
          fi

      - name: Scene runtime and affected regressions
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            test_scene_runtime_integration.gd
            test_cafe_physical_layout.gd
            test_cafe_annex.gd
            test_countertop_faces.gd
            test_kitchen.gd
            test_specialty_kitchen.gd
            test_solyanka_kitchen.gd
            test_staff_lounge.gd
            test_course_editor_ui.gd
            test_product_layout_geometry.gd
          )
          for test in "${tests[@]}"; do
            name="${test%.gd}"
            home="/tmp/home-$name"
            rm -rf "$home"
            mkdir -p "$home"
            echo "=== $test ==="
            HOME="$home" XDG_DATA_HOME="$home/.local/share" timeout 60s "$GODOT_BIN" --headless --path . --script "res://tests/$test"
          done

      - name: Runtime smoke
        shell: bash
        run: |
          set +e
          HOME=/tmp/runtime-home XDG_DATA_HOME=/tmp/runtime-home/.local/share timeout 8s "$GODOT_BIN" --headless --path . > /tmp/runtime-smoke.log 2>&1
          code=$?
          set -e
          cat /tmp/runtime-smoke.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Invalid access" /tmp/runtime-smoke.log; then
            exit 1
          fi
