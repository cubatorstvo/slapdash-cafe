name: Temporary final-inspection smoke

on:
  push:
    branches:
      - work/final-inspection-stage1

jobs:
  changed-tests:
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_final_fifth_star.gd
          - test_fifth_star_prep.gd
          - test_four_to_five_handoff.gd
          - test_cafe_journey.gd
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Run ${{ matrix.test }}
        shell: bash
        run: |
          set -euo pipefail
          export GODOT_SILENCE_ROOT_WARNING=1
          tmp="$(mktemp -d)"
          XDG_DATA_HOME="$tmp" timeout 180 /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://tests/${{ matrix.test }}"
