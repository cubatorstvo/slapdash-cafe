<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<defs>
  <style>
    .t{font-family:Arial,sans-serif;fill:#18323d}.h{font-size:28px;font-weight:700}.m{font-size:18px;font-weight:700}.s{font-size:14px}
    .room{stroke:#1f5e66;stroke-width:4;rx:18}.k{fill:#fff3d6}.back{fill:#dff2e7}.chef{fill:#ffe0a3;stroke:#9a5a00;stroke-width:4;rx:20}
    .stage{fill:none;stroke-width:8;rx:20}
  </style>
</defs>
<rect width="1200" height="820" fill="#f7f2e7"/>
<text x="600" y="42" text-anchor="middle" class="t h">ЭТАПЫ РАСШИРЕНИЯ КАФЕ</text>

<circle cx="220" cy="72" r="8" fill="#ef2b2d"/><text x="238" y="78" class="t s">1 — старт</text>
<circle cx="400" cy="72" r="8" fill="#1428e8"/><text x="418" y="78" class="t s">2 — первая автоматизация</text>
<circle cx="690" cy="72" r="8" fill="#1fab54"/><text x="708" y="78" class="t s">3 — мидгейм</text>
<circle cx="900" cy="72" r="8" fill="#f0df00"/><text x="918" y="78" class="t s">4 — лейтгейм</text>

<rect x="70" y="110" width="450" height="180" class="room back"/><text x="295" y="145" text-anchor="middle" class="t m">ЛАБОРАТОРИЯ</text>
<line x1="220" y1="110" x2="220" y2="290" stroke="#7ea8a6" stroke-width="2" stroke-dasharray="7 7"/>
<line x1="370" y1="110" x2="370" y2="290" stroke="#7ea8a6" stroke-width="2" stroke-dasharray="7 7"/>

<rect x="680" y="110" width="450" height="180" class="room back"/><text x="905" y="145" text-anchor="middle" class="t m">КОМНАТА ОТДЫХА</text>
<line x1="830" y1="110" x2="830" y2="290" stroke="#7ea8a6" stroke-width="2" stroke-dasharray="7 7"/>
<line x1="980" y1="110" x2="980" y2="290" stroke="#7ea8a6" stroke-width="2" stroke-dasharray="7 7"/>

<rect x="40" y="315" width="1120" height="58" fill="#d6eceb" stroke="#1f5e66" stroke-width="4" rx="12"/>
<text x="600" y="350" text-anchor="middle" class="t m">ЗАДНЯЯ МАГИСТРАЛЬ / ОБЩИЙ ВИДИМЫЙ ПОТОК</text>

<rect x="490" y="390" width="220" height="118" class="chef"/>
<text x="600" y="438" text-anchor="middle" class="t h">ШЕФ</text>
<text x="600" y="468" text-anchor="middle" class="t s">не меняет положение при расширениях</text>

<rect x="70" y="405" width="360" height="140" class="room k"/><text x="250" y="445" text-anchor="middle" class="t m">КУХОННЫЙ СЕКТОР 2</text><text x="250" y="478" text-anchor="middle" class="t s">открывается на этапе 3</text>
<rect x="770" y="405" width="360" height="140" class="room k"/><text x="950" y="445" text-anchor="middle" class="t m">ПЕРВЫЙ КУХОННЫЙ СЕКТОР</text><text x="950" y="478" text-anchor="middle" class="t s">5 производственных мест · этап 2</text>
<rect x="70" y="575" width="360" height="150" class="room k"/><text x="250" y="618" text-anchor="middle" class="t m">ЛЕЙТГЕЙМ-СЕКТОР</text><text x="250" y="650" text-anchor="middle" class="t s">открывается на этапе 4</text>
<rect x="770" y="575" width="360" height="150" class="room k"/><text x="950" y="618" text-anchor="middle" class="t m">ЛЕЙТГЕЙМ-СЕКТОР</text><text x="950" y="650" text-anchor="middle" class="t s">открывается на этапе 4</text>

<rect x="500" y="510" width="200" height="240" fill="#eaf4ff" stroke="#8ab6db" stroke-width="2" stroke-dasharray="8 8" rx="20"/>
<text x="600" y="720" text-anchor="middle" class="t s">ГЛАВНЫЙ ПРОХОД</text>
<rect x="520" y="770" width="160" height="34" fill="#d7d7d7" stroke="#555" stroke-width="2" rx="6"/><text x="600" y="794" text-anchor="middle" class="t m">ВХОД / ВЫХОД</text>

<!-- Этап 1: Шеф + правая треть лаборатории -->
<rect x="475" y="375" width="250" height="150" class="stage" stroke="#ef2b2d"/>
<rect x="370" y="110" width="150" height="180" class="stage" stroke="#ef2b2d"/>

<!-- Этап 2: первый сектор + левая треть комнаты отдыха -->
<rect x="755" y="390" width="390" height="170" class="stage" stroke="#1428e8"/>
<rect x="680" y="110" width="150" height="180" class="stage" stroke="#1428e8"/>

<!-- Этап 3: второй сектор + следующая треть лаборатории и отдыха -->
<rect x="55" y="390" width="390" height="170" class="stage" stroke="#1fab54"/>
<rect x="220" y="110" width="150" height="180" class="stage" stroke="#1fab54"/>
<rect x="830" y="110" width="150" height="180" class="stage" stroke="#1fab54"/>

<!-- Этап 4: всё оставшееся -->
<rect x="55" y="560" width="1090" height="180" class="stage" stroke="#f0df00"/>
<rect x="70" y="110" width="150" height="180" class="stage" stroke="#f0df00"/>
<rect x="980" y="110" width="150" height="180" class="stage" stroke="#f0df00"/>

<text x="90" y="312" class="t s">пространство раскрывается тремя крупными расширениями; знакомые зоны не переезжают</text>
</svg>